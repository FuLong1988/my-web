    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #a32323;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header img {
            height: 50px;
        }
        nav {
            display: flex;
            gap: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .contact-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .contact-info h2 {
            color: #a32323;
            margin-bottom: 10px;
        }
        .contact-info img {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
        }
        @media (max-width: 768px) {
            .contact-info img {
                width: 100px;
                height: 100px;
            }
        }
        @media (max-width: 480px) {
            .contact-info img {
                width: 80px;
                height: 80px;
            }
            header nav a {
                font-size: 14px;
            }
        }
    </style>
    <script>
        function detectmob() { 
            if (navigator.userAgent.match(/Android/i) ||
                navigator.userAgent.match(/webOS/i) ||
                navigator.userAgent.match(/iPhone/i) ||
                navigator.userAgent.match(/iPad/i) ||
                navigator.userAgent.match(/iPod/i) ||
                navigator.userAgent.match(/BlackBerry/i) ||
                navigator.userAgent.match(/Windows Phone/i)) {
                return true;
            } else {
                return false;
            }
        }

        window.onload = function () {
            if (detectmob()) {
                document.body.style.backgroundColor = "#e6f7ff"; // 行動裝置更改背景顏色
                alert("您正在使用行動裝置瀏覽本網站");
            }
        };
    </script>
</head>
